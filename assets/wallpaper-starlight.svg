<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
<defs>
 <radialGradient id="bg" cx="30%" cy="68%" r="78%"><stop stop-color="#cec1e0"/><stop offset=".42" stop-color="#d7d2e2"/><stop offset="1" stop-color="#dcdbe0"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d1c9e2"/><stop offset=".25" stop-color="#a489c4"/><stop offset=".5" stop-color="#6a5675"/><stop offset=".72" stop-color="#8674af"/><stop offset="1" stop-color="#d1c9e2"/></linearGradient>
 <linearGradient id="dawn" x1=".73" y1=".95" x2=".5" y2=".5"><stop stop-color="#5c4e63"/><stop offset=".3" stop-color="#7f6090" stop-opacity=".9"/><stop offset=".62" stop-color="#9d8ac7" stop-opacity="0"/></linearGradient>
 <radialGradient id="planet" cx="28%" cy="22%" r="80%"><stop stop-color="#c4b5db"/><stop offset=".32" stop-color="#d2cce1"/><stop offset=".78" stop-color="#dbd9e0"/><stop offset="1" stop-color="#dcdbe0"/></radialGradient>
 <radialGradient id="moon" cx="30%" cy="30%" r="80%"><stop stop-color="#ad9fc8"/><stop offset=".6" stop-color="#cfcadd"/><stop offset="1" stop-color="#d9d6df"/></radialGradient>
 <clipPath id="front"><rect x="-900" y="0" width="1800" height="400"/></clipPath>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<rect width="2560" height="1600" fill="url(#bg)"/>
