# PENUMBRA colours for yazi. Generated by tools/build-palette.py from palette/palette.toml; do not edit.
# ./install.sh puts the syntax colours next to it (tmtheme.xml, bat's theme) and selects the flavor
# in your theme.toml. Unset keys keep yazi's defaults.

[mgr]
cwd = { fg = "{{cyan}}" }
find_keyword = { fg = "{{amber}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{pink}}", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "{{cyan}}", italic = true }
marker_copied = { fg = "{{green}}", bg = "{{green}}" }
marker_cut = { fg = "{{rose}}", bg = "{{rose}}" }
marker_marked = { fg = "{{cyan}}", bg = "{{cyan}}" }
marker_selected = { fg = "{{accent}}", bg = "{{accent}}" }
count_copied = { fg = "{{onAccent}}", bg = "{{green}}" }
count_cut = { fg = "{{onAccent}}", bg = "{{rose}}" }
count_selected = { fg = "{{onAccent}}", bg = "{{accent}}" }
border_style = { fg = "{{border}}" }

[tabs]
active = { fg = "{{onAccent}}", bg = "{{accent}}", bold = true }
inactive = { fg = "{{muted}}", bg = "{{raised}}" }

[mode]
normal_main = { fg = "{{onAccent}}", bg = "{{accent}}", bold = true }
normal_alt = { fg = "{{accent}}", bg = "{{raised}}" }
select_main = { fg = "{{onAccent}}", bg = "{{pink}}", bold = true }
select_alt = { fg = "{{pink}}", bg = "{{raised}}" }
unset_main = { fg = "{{onAccent}}", bg = "{{rose}}", bold = true }
unset_alt = { fg = "{{rose}}", bg = "{{raised}}" }

[indicator]
parent = { fg = "{{white}}", bg = "{{raised}}" }
current = { fg = "{{white}}", bg = "{{hover}}" }
preview = { fg = "{{white}}", bg = "{{raised}}" }

[status]
perm_sep = { fg = "{{dim}}" }
perm_type = { fg = "{{accent}}" }
perm_read = { fg = "{{amber}}" }
perm_write = { fg = "{{rose}}" }
perm_exec = { fg = "{{green}}" }
progress_label = { fg = "{{text}}", bold = true }
progress_normal = { fg = "{{accent}}", bg = "{{raised}}" }
progress_error = { fg = "{{rose}}", bg = "{{raised}}" }

[which]
cand = { fg = "{{accent}}" }
rest = { fg = "{{dim}}" }
desc = { fg = "{{textSoft}}" }
separator_style = { fg = "{{dim}}" }

[confirm]
border = { fg = "{{accent}}" }
title = { fg = "{{accent}}" }
btn_yes = { fg = "{{onAccent}}", bg = "{{accent}}" }

[spot]
border = { fg = "{{accent}}" }
title = { fg = "{{accent}}" }
tbl_col = { fg = "{{accent}}" }
tbl_cell = { fg = "{{white}}", bg = "{{hover}}" }

[notify]
title_info = { fg = "{{green}}" }
title_warn = { fg = "{{amber}}" }
title_error = { fg = "{{rose}}" }

[pick]
border = { fg = "{{accent}}" }
active = { fg = "{{accent}}", bold = true }

[input]
border = { fg = "{{accent}}" }
selected = { bg = "{{textSelection}}" }

[cmp]
border = { fg = "{{accent}}" }
active = { fg = "{{white}}", bg = "{{hover}}" }

[tasks]
border = { fg = "{{accent}}" }
hovered = { fg = "{{accent}}", bold = true }

[help]
