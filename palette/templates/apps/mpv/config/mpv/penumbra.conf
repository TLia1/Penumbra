# PENUMBRA colours for mpv. Generated by tools/build-palette.py from palette/palette.toml; do not edit.
# ./install.sh adds include="~~/penumbra.conf" to your mpv.conf.
osd-color='{{text}}'
osd-border-color='{{base}}'
# The on-screen controller (mpv 0.38 and later).
script-opts-append=osc-background_color={{base}}
script-opts-append=osc-timecode_color={{textSoft}}
script-opts-append=osc-title_color={{text}}
script-opts-append=osc-buttons_color={{text}}
script-opts-append=osc-top_buttons_color={{textSoft}}
script-opts-append=osc-held_element_color={{violetBright}}
script-opts-append=osc-seekbar_fg_color={{violet}}
script-opts-append=osc-seekbar_bg_color={{raised}}
script-opts-append=osc-seekbar_cache_color={{hover}}
script-opts-append=osc-window_title_color={{text}}
script-opts-append=osc-window_controls_color={{textSoft}}
script-opts-append=osc-window_controls_close_hover={{rose}}
# uosc, if installed.
script-opts-append=uosc-color=foreground={{violet:hex}},foreground_text={{violetInk:hex}},background={{base:hex}},background_text={{text:hex}},curtain={{shade:hex}},success={{green:hex}},error={{rose:hex}}
