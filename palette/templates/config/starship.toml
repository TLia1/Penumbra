# PENUMBRA prompt. Generated by tools/build-palette.py from palette/templates/config/starship.toml
# and palette/palette.toml; edit those.
add_newline = true
format = "[]({{raised}})[󰣇 ](bold bg:{{raised}} fg:{{accent}})$directory[]({{raised}}) $git_branch$git_status$cmd_duration$character"
right_format = "$time"
[directory]
style = "bold bg:{{raised}} fg:{{text}}"
format = "[$path]($style)[$read_only]($read_only_style)"
read_only_style = "bg:{{raised}} fg:{{rose}}"
truncation_length = 3
truncation_symbol = "…/"
[character]
success_symbol = "[❯](bold {{accent}})"
error_symbol = "[❯](bold {{rose}})"
[git_branch]
symbol = " "
style = "bg:{{raised}} fg:{{cyan}}"
format = "[]({{raised}})[$symbol$branch]($style)[]({{raised}}) "
[git_status]
style = "{{amber}}"
[cmd_duration]
min_time = 2000
format = "[ · $duration ]({{muted}})"
[time]
disabled = false
time_format = "%H:%M"
format = "[󰥔 $time]({{dim}})"
