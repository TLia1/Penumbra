# PENUMBRA prompt. Generated by tools/build-palette.py from palette/templates/config/starship.toml
# and palette/palette.toml; edit those.
add_newline = true
format = "[󰣇 ](bold {{violet}})$directory$git_branch$git_status$cmd_duration$character"
right_format = "$time"
[directory]
style = "bold {{violet}}"
truncation_length = 3
truncation_symbol = "…/"
[character]
success_symbol = "[❯](bold {{violet}})"
error_symbol = "[❯](bold {{rose}})"
[git_branch]
symbol = " "
style = "{{cyan}}"
[git_status]
style = "{{amber}}"
[cmd_duration]
min_time = 2000
format = "[ · $duration]({{muted}})"
[time]
disabled = false
time_format = "%H:%M"
format = "[󰥔 $time]({{dim}})"
