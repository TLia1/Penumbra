# NOCTURNE
shell /usr/bin/fish
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.0
window_padding_width 24
background #0d0a12
foreground #e4dced
background_opacity 0.8
dynamic_background_opacity yes
selection_background #563b7e
selection_foreground #ffffff
cursor #bb9af7
cursor_text_color #100b1b
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.12 0.35
cursor_blink_interval 0.6
url_color #c4a5ff
color0 #231d2e
color1 #ef8fa4
color2 #a5ccb3
color3 #e5c89a
color4 #a1a5e9
color5 #b69af7
color6 #9ccbd2
color7 #ded5e8
color8 #71637f
color9 #f7a3b6
color10 #b9e0c6
color11 #f4dab0
color12 #b8bdf5
color13 #ceb4ff
color14 #b4e0e5
color15 #faf5ff
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #a78bfa
active_tab_foreground #110d19
inactive_tab_background #21192e
inactive_tab_foreground #9687aa
hide_window_decorations yes
enable_audio_bell no
confirm_os_window_close 0
remember_window_size yes
initial_window_width 100c
initial_window_height 28c
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
