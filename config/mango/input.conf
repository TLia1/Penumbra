# PENUMBRA / MangoWM — Input & default applications (overridden by settings.conf)

var=terminal,kitty
var=file_manager,io.github.lia.Files

# Keyboard
xkb_rules_layout=us
numlock_on=1
repeat_rate=45
repeat_delay=250

# Trackpad
disable_trackpad=0
trackpad_natural_scrolling=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=0
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0
mouse_accel_speed=0.0
axis_bind_apply_timeout=100
