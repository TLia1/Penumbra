# PENUMBRA / MangoWM — Appearance, SceneFX & native bars

border_px=2
enable_border_resize=1
no_border_when_single=0
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=14
gap_outer_vertical=14
smart_gaps=0
border_radius=12
no_radius_when_single=0

# Scratchpad & special tag geometry
scratchpad_width_ratio=0.78
scratchpad_height_ratio=0.82
scratchpad_cross_monitor=1

# Blur (SceneFX)
blur=1
blur_layer=0
blur_optimized=0
blur_params_num_passes=4
blur_params_radius=10
blur_params_noise=0.025
blur_params_brightness=0.9
blur_params_contrast=1.1
blur_params_saturation=1.1

# Shadows (SceneFX)
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=12
shadows_blur=14
shadows_position_x=-12
shadows_position_y=-10

# Opacity & dimming
focused_opacity=1.0
unfocused_opacity=0.97
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000033

# Native window group bar
always_show_group_bar=0
group_bar_height=26
group_bar_decorate_corner_radius=8
group_bar_decorate_border_width=1
group_bar_decorate_padding_x=10
group_bar_decorate_padding_y=4
group_bar_close_button_enable=1

# Native monocle & deck tab bar
tab_bar_height=26
tab_bar_decorate_corner_radius=8
tab_bar_decorate_border_width=1
tab_bar_decorate_padding_x=10
tab_bar_decorate_padding_y=4

# Native jump labels (togglejump)
jump_label_decorate_corner_radius=6
jump_label_decorate_border_width=1
jump_label_decorate_padding_x=8
jump_label_decorate_padding_y=4
