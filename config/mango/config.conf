# PENUMBRA / MangoWM configuration
# Keyboard, Num Lock, scale and default apps come from ~/.config/mango/settings.conf, which
# ./install.sh and the shell's Settings write; screens from ~/.config/mango/monitors.conf, which
# Settings -> Displays writes. Put your own settings in ~/.config/mango/user.conf, which is read
# last and survives ./install.sh.

source_optional=~/.config/mango/colors.conf

# Environment & cursor
env=XCURSOR_THEME,Penumbra-Cursors
env=XCURSOR_SIZE,28
env=QT_QPA_PLATFORMTHEME,qt6ct
env=GTK_USE_PORTAL,1

cursor_theme=Penumbra-Cursors
cursor_size=28

# Appearance & effects (SceneFX)
border_px=2
enable_border_resize=1
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=14
gap_outer_vertical=14
smart_gaps=0
border_radius=12
no_radius_when_single=0

blur=1
blur_layer=0
blur_optimized=0
blur_params_num_passes=4
blur_params_radius=10
blur_params_noise=0.025
blur_params_brightness=0.9
blur_params_contrast=1.1
blur_params_saturation=1.1

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=12
shadows_blur=14
shadows_position_x=-12
shadows_position_y=-10

focused_opacity=1.0
unfocused_opacity=0.97

# Animations
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.88
zoom_end_ratio=0.96
fade_in_begin_opacity=0.6
fade_out_begin_opacity=0.8
animation_duration_move=220
animation_duration_open=220
animation_duration_tag=220
animation_duration_close=160
animation_duration_focus=150
animation_curve_open=0.05,0.9,0.1,1.04
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.05,0.9,0.1,1.04
animation_curve_close=0.4,0.0,0.2,1.0
animation_curve_focus=0.16,1.0,0.3,1.0

# Layouts & focus
sloppy_focus=1
warp_cursor=0
focus_on_activate=1
drag_tile_to_tile=1
new_is_master=1
default_master_factor=0.55
default_master_count=1
dwindle_preserve_split=1
dwindle_smart_split=0
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
circle_layout=dwindle,tile,scroller,center_tile,grid,deck,monocle
tag_rule=id:*,layout_name:dwindle,master_factor:0.55,scroller_default_proportion:0.8
xwayland_ignore_scale=1
idle_inhibit_when_fullscreen=1

# Input & app defaults (overridden by settings.conf)
var=terminal,kitty
var=file_manager,io.github.lia.Files
xkb_rules_layout=us
numlock_on=1
repeat_rate=35
repeat_delay=250

trackpad_natural_scrolling=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=0
mouse_natural_scrolling=0
mouse_accel_speed=0.0

# Per-display rules first (MangoWM applies the first matching monitor_rule), then settings & corners
source_optional=~/.config/mango/monitors.conf
source_optional=~/.config/mango/settings.conf
source_optional=~/.config/mango/corners.conf

# Window & layer rules
window_rule=app_id:^(org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|qt6ct)$,is_floating:1,width:820,height:540
window_rule=app_id:^(com\.gabm\.satty)$,is_floating:1
window_rule=title:^(Picture-in-Picture|Picture in picture)$,is_floating:1,is_global:1,width:480,height:270
window_rule=title:^(Open File|Open Files|Open Folder|Select Folder|Save File|Save As|Save Image|File Upload|Choose Files?)(.*)$,is_floating:1,width:900,height:600
window_rule=app_id:.*,ignore_maximize:1

layer_rule=layer_name:^penumbra-shot$,no_animation:1,no_blur:1,no_shadow:1
layer_rule=layer_name:^penumbra-screen-frame$,no_animation:1,no_blur:1,no_shadow:1
layer_rule=layer_name:^penumbra-backdrop$,no_animation:1,no_blur:1,no_shadow:1

# Keybindings
bind=SUPER,Return,spawn_shell,gtk-launch ${terminal} || kitty # Open terminal
bind=SUPER,Q,spawn_shell,gtk-launch ${terminal} || kitty # Open terminal
bind=SUPER,E,spawn_shell,gtk-launch ${file_manager} || lia-files || dolphin # Open file manager
bind=SUPER,R,spawn,~/.local/bin/penumbra-launcher # App launcher
bind=SUPER,space,spawn,~/.local/bin/penumbra-launcher # App launcher
bind=SUPER,B,spawn_shell,gtk-launch "$(xdg-settings get default-web-browser)" # Open web browser
bind=SUPER,M,spawn,~/.local/bin/penumbra-power # Session menu
bind=SUPER,L,spawn,loginctl lock-session # Lock screen
bind=SUPER,N,spawn,quickshell -c penumbra ipc call notifications clear # Clear notifications
bind=SUPER,A,spawn,quickshell -c penumbra ipc call panel control # Control center
bind=SUPER,F1,spawn,quickshell -c penumbra ipc call panel keybinds # Show keyboard shortcuts
bind=SUPER,comma,spawn,quickshell -c penumbra ipc call panel settings # Settings
bind=SUPER+SHIFT,V,spawn,~/.local/bin/penumbra-clipboard # Clipboard history
bind=SUPER,semicolon,spawn,quickshell -c penumbra ipc call launcher emoji # Emoji and symbols
bind=ALT,Tab,spawn,quickshell -c penumbra ipc call launcher windows # Search open windows
bind=SUPER+SHIFT,C,spawn,~/.local/bin/penumbra-picker # Pick a color
bind=SUPER,W,spawn,~/.local/bin/penumbra-wallpaper next # Next wallpaper
bind=SUPER+SHIFT,W,spawn,quickshell -c penumbra ipc call panel wallpapers # Wallpaper picker
bind=SUPER,D,spawn,quickshell -c penumbra ipc call panel downloads # Download video or audio
bind=SUPER+SHIFT,R,spawn,~/.local/bin/penumbra-session restart # Restart shell
bind=SUPER,code:49,spawn,quickshell -c penumbra ipc call panel overview # Workspace overview
gesturebind=NONE,up,4,spawn,quickshell -c penumbra ipc call panel overview # Workspace overview
bindrp=NONE,Caps_Lock,spawn,quickshell -c penumbra ipc call osd capsLock # Show Caps Lock status
bind=NONE,Print,spawn,~/.local/bin/penumbra-shot # Screenshot
bind=SHIFT,Print,spawn,~/.local/bin/penumbra-shot annotate # Screenshot and annotate
bind=CTRL,Print,spawn,~/.local/bin/penumbra-record # Start or stop screen recording

# Window management
bind=SUPER,C,killclient # Close window
bind=SUPER,V,togglefloating # Toggle floating window
bind=SUPER,F,togglefullscreen # Fullscreen window
bind=SUPER,J,dwindle_toggle_current_split # Toggle split direction
bind=SUPER+SHIFT,space,switch_layout # Cycle tiling layout
bind=SUPER,P,toggleglobal # Pin window to all workspaces
bind=SUPER,G,groupjoin,right # Toggle window group
bind=SUPER,Tab,groupfocus,next # Next tab in group
bind=SUPER+SHIFT,Tab,groupfocus,prev # Previous tab in group
bind=SUPER,S,toggle_scratchpad # Show or hide scratchpad
bind=SUPER+SHIFT,S,minimized # Move window to scratchpad

# Focus, move & resize
bind=SUPER,left,focusdir,left # Focus window left
bind=SUPER,right,focusdir,right # Focus window right
bind=SUPER,up,focusdir,up # Focus window up
bind=SUPER,down,focusdir,down # Focus window down
bind=SUPER+SHIFT,left,exchange_client,left # Move window left
bind=SUPER+SHIFT,right,exchange_client,right # Move window right
bind=SUPER+SHIFT,up,exchange_client,up # Move window up
bind=SUPER+SHIFT,down,exchange_client,down # Move window down
bind=SUPER+CTRL,left,resizewin,-40,0 # Resize window left
bind=SUPER+CTRL,right,resizewin,+40,0 # Resize window right
bind=SUPER+CTRL,up,resizewin,0,-40 # Resize window up
bind=SUPER+CTRL,down,resizewin,0,+40 # Resize window down

# Workspaces / tags (1-9)
bind=SUPER,code:10,view,1,0 # Switch to workspace 1
bind=SUPER,code:11,view,2,0 # Switch to workspace 2
bind=SUPER,code:12,view,3,0 # Switch to workspace 3
bind=SUPER,code:13,view,4,0 # Switch to workspace 4
bind=SUPER,code:14,view,5,0 # Switch to workspace 5
bind=SUPER,code:15,view,6,0 # Switch to workspace 6
bind=SUPER,code:16,view,7,0 # Switch to workspace 7
bind=SUPER,code:17,view,8,0 # Switch to workspace 8
bind=SUPER,code:18,view,9,0 # Switch to workspace 9
bind=SUPER,code:19,view,9,0 # Switch to workspace 10
bind=SUPER+SHIFT,code:10,tag,1,0 # Move window to workspace 1
bind=SUPER+SHIFT,code:11,tag,2,0 # Move window to workspace 2
bind=SUPER+SHIFT,code:12,tag,3,0 # Move window to workspace 3
bind=SUPER+SHIFT,code:13,tag,4,0 # Move window to workspace 4
bind=SUPER+SHIFT,code:14,tag,5,0 # Move window to workspace 5
bind=SUPER+SHIFT,code:15,tag,6,0 # Move window to workspace 6
bind=SUPER+SHIFT,code:16,tag,7,0 # Move window to workspace 7
bind=SUPER+SHIFT,code:17,tag,8,0 # Move window to workspace 8
bind=SUPER+SHIFT,code:18,tag,9,0 # Move window to workspace 9
bind=SUPER+SHIFT,code:19,tag,9,0 # Move window to workspace 10
bind=SUPER+ALT,code:10,tagsilent,1 # Send window to workspace 1 without following
bind=SUPER+ALT,code:11,tagsilent,2 # Send window to workspace 2 without following
bind=SUPER+ALT,code:12,tagsilent,3 # Send window to workspace 3 without following
bind=SUPER+ALT,code:13,tagsilent,4 # Send window to workspace 4 without following
bind=SUPER+ALT,code:14,tagsilent,5 # Send window to workspace 5 without following
bind=SUPER+ALT,code:15,tagsilent,6 # Send window to workspace 6 without following
bind=SUPER+ALT,code:16,tagsilent,7 # Send window to workspace 7 without following
bind=SUPER+ALT,code:17,tagsilent,8 # Send window to workspace 8 without following
bind=SUPER+ALT,code:18,tagsilent,9 # Send window to workspace 9 without following
bind=SUPER+ALT,code:19,tagsilent,9 # Send window to workspace 10 without following

gesturebind=NONE,left,3,viewtoright,0 # Next workspace
gesturebind=NONE,right,3,viewtoleft,0 # Previous workspace

mousebind=SUPER,btn_left,moveresize,curmove # Drag window
mousebind=SUPER,btn_right,moveresize,curresize # Resize window with mouse
axisbind=SUPER,down,viewtoright,0 # Next workspace
axisbind=SUPER,up,viewtoleft,0 # Previous workspace

# Media & brightness keys
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.local/bin/penumbra-osd volume up # Volume up
bindl=NONE,XF86AudioLowerVolume,spawn,~/.local/bin/penumbra-osd volume down # Volume down
bindl=NONE,XF86MonBrightnessUp,spawn,~/.local/bin/penumbra-osd brightness up # Brightness up
bindl=NONE,XF86MonBrightnessDown,spawn,~/.local/bin/penumbra-osd brightness down # Brightness down
bindl=NONE,XF86AudioMute,spawn,~/.local/bin/penumbra-osd volume mute # Mute audio
bindl=NONE,XF86AudioMicMute,spawn,~/.local/bin/penumbra-osd microphone mute # Mute microphone
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause # Play or pause media
bindl=NONE,XF86AudioNext,spawn,playerctl next # Next track
bindl=NONE,XF86AudioPrev,spawn,playerctl previous # Previous track

# Autostart
exec_once=~/.local/bin/penumbra-session

# User overrides (kept across updates)
source_optional=~/.config/mango/user.conf
