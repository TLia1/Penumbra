# PENUMBRA / MangoWM configuration
# Modular configuration split across ~/.config/mango/*.conf:
#   colors.conf     — Palette colors (borders, scratchpad, global, group/tab/jump bars)
#   env.conf        — Environment variables & cursor theme
#   appearance.conf — Borders, gaps, SceneFX blur/shadows, opacity & native bar styling
#   animations.conf — Window, layer & tag animation curves and durations
#   layouts.conf    — All 14 MangoWM tiling layouts, tags, focus & native overview
#   input.conf      — Default apps, XKB keyboard, trackpad & mouse defaults
#   monitors.conf   — Per-display rules written by Settings -> Displays
#   settings.conf   — Keyboard, scale & tiling preferences written by penumbra-settings
#   corners.conf    — Rounded or sharp corner radius written by penumbra-corners
#   rules.conf      — Window rules (swallowing, floating dialogs, PiP) & layer rules
#   keybinds.conf   — Keyboard, multi-tag, scroller, group, mouse, gesture & keymode bindings
#   autostart.conf  — Session startup
#   user.conf       — Your own overrides (read last and preserved across ./install.sh)

source_optional=./colors.conf
source=./env.conf
source=./appearance.conf
source=./animations.conf
source=./layouts.conf
source=./input.conf

# Mango 0.18 selects the first matching rule at startup and the last on reload.
# Put per-display rules on either side of the installer’s default scale.
source_optional=~/.config/mango/monitors.conf
source_optional=~/.config/mango/settings.conf
source_optional=~/.config/mango/monitors.conf
source_optional=~/.config/mango/corners.conf

source=./rules.conf
source=./keybinds.conf
source=./autostart.conf

# User overrides (kept across updates)
source_optional=~/.config/mango/user.conf
