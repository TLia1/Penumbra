# PENUMBRA / MangoWM — Tiling layouts, tags & focus

# Focus & pointer behavior
sloppy_focus=1
warp_cursor=0
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
focus_direction_only_zone_overlap=1
drag_tile_to_tile=1
drag_tile_small=1
enable_floating_snap=1
snap_distance=24
float_full_to_top=1
xwayland_ignore_scale=1
idle_inhibit_when_fullscreen=1
idle_inhibit_ignore_visible=0

# Tags & layout cycle (all 14 MangoWM layouts available)
tag_num=9
view_current_to_back=1
circle_layout=dwindle,tile,scroller,center_tile,right_tile,grid,deck,monocle,fair,vertical_scroller,vertical_tile,vertical_grid,vertical_deck,vertical_fair
tag_rule=id:*,layout_name:dwindle,master_factor:0.55,scroller_default_proportion:0.8

# Dwindle layout
dwindle_preserve_split=1
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1

# Master & stack / Center tile / Right tile / Deck
new_is_master=1
default_master_factor=0.55
default_master_count=1
deck_tab_mode=1

# Scroller layout (horizontal & vertical scrolling columns)
scroller_structs=20
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.67,0.8,1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0

# Monocle layout
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Native MangoWM overview & hotarea
enable_hotarea=0
hotarea_size=10
hotarea_disable_on_fullscreen=1
overview_gap_inner=6
overview_gap_outer=28
overcircle_center_ratio=0.5
title_message_bar_height=48
title_message_bar_gap=18
