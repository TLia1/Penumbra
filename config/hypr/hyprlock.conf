general {
    hide_cursor = true
    immediate_render = true
    screencopy_mode = 1
}
background {
    monitor =
    path = ~/.local/share/nocturne/wallpaper-clean.png
    blur_passes = 2
    blur_size = 3
    brightness = 0.7
}
label {
    monitor =
    text = $TIME
    color = rgba(e9e1f5ff)
    font_size = 84
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}
label {
    monitor =
    text = N O C T U R N E   /   $USER
    color = rgba(b69af7ff)
    font_size = 12
    font_family = Inter
    position = 0, 20
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 310, 56
    outline_thickness = 2
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(8e6ac8ff)
    inner_color = rgba(15101fee)
    font_color = rgba(e9e1f5ff)
    check_color = rgba(a5ccb3ff)
    fail_color = rgba(ef8fa4ff)
    placeholder_text = Enter password
    fail_text = Try again ($ATTEMPTS)
    rounding = 14
    position = 0, -65
    halign = center
    valign = center
}
