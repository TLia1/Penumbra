# Colours come from hyprlock-colors.conf, generated from palette/palette.toml.
source = ~/.config/hypr/hyprlock-colors.conf
general {
    hide_cursor = true
    immediate_render = true
    screencopy_mode = 1
}
background {
    monitor =
    path = ~/.local/share/penumbra/lock.png
    blur_passes = 2
    blur_size = 3
    brightness = 0.7
}
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 84
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}
label {
    monitor =
    text = P E N U M B R A   /   $USER
    color = $accent
    font_size = 12
    font_family = Inter
    position = 0, 20
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 310, 56
    outline_thickness = 2
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $outline
    inner_color = $field
    font_color = $text
    check_color = $check
    fail_color = $fail
    placeholder_text = Enter password
    fail_text = Try again ($ATTEMPTS)
    rounding = 14
    position = 0, -65
    halign = center
    valign = center
}
